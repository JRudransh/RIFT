[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rift"
version = "0.1.0"
description = "Strict JSON-driven FastAPI backend generator."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.4",
    "typer>=0.12.5",
]
keywords = ["fastapi", "generator", "template", "mongodb", "rbac"]
classifiers = [
    "Environment :: Console",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
rift = "rift.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rift"]

[tool.hatch.build.targets.wheel.force-include]
"src/rift/templates" = "rift/templates"

[tool.hatch.build.targets.sdist]
include = [
    "README.md",
    "pyproject.toml",
    "src/rift/**/*",
    "tests/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
